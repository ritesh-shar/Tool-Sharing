name: Backend Tests

on:
  push:
    branches:
      - main

jobs:
    test: 
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: server

        steps:
            - name: Checkout code
              uses: actions/checkout@v5 
                
            - name:  Set up Node.js
              uses: actions/setup-node@v5
              with:
               node-version: '22'
            
            - name: Install dependencies
              run: npm ci
            
            - name: Run tests
              run: npm test
